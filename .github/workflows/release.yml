name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystores
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            APP_KEYSTORE_BASE64 APP_KEYSTORE_PASSWORD APP_KEY_ALIAS APP_KEY_PASSWORD \
            FDROID_KEYSTORE_BASE64 FDROID_KEYSTORE_PASSWORD FDROID_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/slimtrack-release.jks"
          mkdir -p fdroid
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > fdroid/keystore.jks
          chmod 600 "$RUNNER_TEMP/slimtrack-release.jks" fdroid/keystore.jks

      - name: Build signed release APK
        env:
          SLIMTRACK_KEYSTORE: ${{ runner.temp }}/slimtrack-release.jks
          SLIMTRACK_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          SLIMTRACK_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          SLIMTRACK_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease
          --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Signed release APK not found at $APK"
            exit 1
          fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Prepare version metadata
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building SlimTrack $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fdroidserver
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Build F-Droid repository index
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          mkdir -p fdroid/repo
          cp "$APK" "fdroid/repo/SlimTrack-${VERSION_NAME}.apk"

          python3 - <<'PY'
          import os
          import yaml

          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          repository = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1].lower()
          if repository == f"{owner}.github.io":
              pages_url = f"https://{owner}.github.io"
          else:
              pages_url = f"https://{owner}.github.io/{repository}"
          repo_url = f"{pages_url}/fdroid/repo"
          config = {
              "repo_url": repo_url,
              "repo_name": "SlimTrack",
              "repo_description": "SlimTrack diet and weight diary releases",
              "keystore": "keystore.jks",
              "keystorepass": os.environ["FDROID_KEYSTORE_PASSWORD"],
              "repo_keyalias": "slimtrack",
              "keypass": os.environ["FDROID_KEY_PASSWORD"],
              "keydname": "CN=SlimTrack F-Droid Repository",
          }
          with open("fdroid/config.yml", "w", encoding="utf-8") as handle:
              yaml.safe_dump(config, handle, default_flow_style=False, sort_keys=False)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"REPO_URL={repo_url}\n")
          PY

          chmod 600 fdroid/config.yml
          cd fdroid
          fdroid update --create-metadata

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p public/fdroid
          cp -r fdroid/repo public/fdroid/repo

          cat > public/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SlimTrack F-Droid repository</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
              code { background: #eee; padding: 0.15rem 0.35rem; border-radius: 0.25rem; word-break: break-all; }
              @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } code { background: #333; } a { color: #6cb6ff; } }
            </style>
          </head>
          <body>
            <h1>SlimTrack F-Droid repository</h1>
            <p>Add this repository to the F-Droid client:</p>
            <p><code>${REPO_URL}</code></p>
            <p><a href="fdroid/repo/">Browse the repository files</a></p>
          </body>
          </html>
          EOF

          {
            echo "### F-Droid repository"
            echo
            echo "Add this URL in F-Droid: $REPO_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: slimtrack-release-apk
          path: fdroid/repo/*.apk
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fdroid/repo/*.apk
          generate_release_notes: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
